name: build

# Central ephemeral image builder — imported AS-IS by every intarweb repo.
#
# ONE workflow, self-detecting: it asks GitHub whether THIS repo is a fork
# (has an upstream parent) and behaves accordingly. No forks.json, no per-repo
# config, no intarweb-dev / deploy branch. Consumers carry a thin workflow
# (operations/consumer/build.yml — the canonical copy) that `uses:` this file
# and nothing else. No repo secrets required — the caller's GITHUB_TOKEN
# (passed via `secrets: inherit`) handles everything.
#
# Hosted in intarweb/operations on purpose: public repo → reusable workflows
# resolve from every intarweb repo, and public repos get unlimited Actions
# minutes.
#
#   FORK        (repo has a parent): hard-sync `main` → pure mirror of the
#               upstream default branch, RE-APPLY the canonical build.yml
#               overlay (the one deterministic commit main carries — without it
#               the schedule would die after one sync), fold every open
#               intarweb→upstream PR onto the tree (cherry-pick, fail-closed on
#               conflict), build → :latest + :sha-<fp>. Rebuilds on our PR
#               updates (fp changes) and on the clock.
#
#   GREENFIELD  (our own project): build the pushed default branch → :latest + :sha-<git>.
#
# Fingerprint = sha256(upstream/main sha + sorted open-PR shas). If
# ghcr.io/intarweb/<name>:sha-<fp> already exists, the build is a no-op.
# Optional repo Variables (with sane defaults): DOCKERFILE, CONTEXT, PLATFORMS.

on:
  workflow_call:

permissions:
  contents: write      # fork: re-apply build.yml overlay + force-push mirror main
  packages: write      # GHCR push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 🧭 Classify fork vs greenfield
        id: cls
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          set -euo pipefail
          PARENT="$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name // ""' 2>/dev/null || true)"
          IS_FORK="false"
          [ -n "$PARENT" ] && IS_FORK="true"
          DEFAULT="${{ github.event.repository.default_branch }}"
          # Sync target = the UPSTREAM's default branch. A fork's own default may
          # differ (bifrost forks main but upstream maximhq/bifrost defaults to dev
          # — the mirror tracks dev). Every other fork's default == upstream's, so
          # this is behavior-neutral for them.
          UP_DEFAULT="$DEFAULT"
          if [ "$IS_FORK" = "true" ]; then
            UP_DEFAULT="$(gh api "repos/$PARENT" --jq '.default_branch' 2>/dev/null || echo "$DEFAULT")"
          fi
          SKIP="false"
          # greenfield: only build on pushes to the default branch (and dispatch/schedule).
          # PR-triggered runs on a greenfield non-default PR branch are a no-op.
          if [ "$IS_FORK" = "false" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ "${{ github.event_name }}" != "schedule" ] \
             && [ "${{ github.ref }}" != "refs/heads/$DEFAULT" ]; then
            SKIP="true"
          fi
          # Image name: explicit IMAGE_NAME repo Variable wins (mcp-neo4j →
          # neo4j-memory, vllm → vllm-openai); else the lowercased repo name.
          IMAGE="$(echo "${IMAGE_NAME:-${{ github.event.repository.name }}}" | tr '[:upper:]' '[:lower:]')"
          echo "fork=$IS_FORK"        >> "$GITHUB_OUTPUT"
          echo "upstream=$PARENT"     >> "$GITHUB_OUTPUT"
          echo "default=$DEFAULT"     >> "$GITHUB_OUTPUT"
          echo "up_default=$UP_DEFAULT" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP"           >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"         >> "$GITHUB_OUTPUT"
          echo "  fork=$IS_FORK  upstream=$PARENT  default=$DEFAULT  up_default=$UP_DEFAULT  skip=$SKIP  image=$IMAGE"

      - name: 📥 Checkout repo (full history)
        if: steps.cls.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          # Submodules are populated BEST-EFFORT below (build-tree step), not here:
          # some forks (keeper.sh) carry gitlinks to private keeperdotsh repos that
          # would abort checkout@v4's recursive clone and fail the whole build.
          submodules: false

      - name: 🔄 Sync fork main → upstream + re-apply build.yml overlay
        id: sync
        if: steps.cls.outputs.skip == 'false' && steps.cls.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          UPSTREAM_URL="https://github.com/${{ steps.cls.outputs.upstream }}.git"
          DEFAULT="${{ steps.cls.outputs.default }}"
          UP_DEFAULT="${{ steps.cls.outputs.up_default }}"
          # 1. put us on the fork's default branch (detached on schedule/dispatch)
          git checkout -B "$DEFAULT" "origin/$DEFAULT"
          # 2. hard-reset to upstream's default branch → pure mirror (bifrost:
          #    upstream default is dev, tracked into fork main)
          git fetch --quiet "$UPSTREAM_URL" "$UP_DEFAULT"
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          git reset --hard "$UPSTREAM_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "  upstream ${{ steps.cls.outputs.upstream }}@$UPSTREAM_SHA"
          # 3. re-apply the canonical consumer overlay (single source: operations/consumer/build.yml)
          # Best-effort: transient network resets must NOT fail the whole run
          # (each failure = a build-failure email fleet-wide). Retry 3x; fall back
          # to the overlay copy already in the tree if fetch keeps failing — the
          # canonical consumer only changes with operations, and the next schedule
          # tick retries.
          if ! curl -fsSL --retry 3 --retry-delay 2 -o /tmp/consumer-build.yml \
            "https://raw.githubusercontent.com/intarweb/operations/main/consumer/build.yml"; then
            echo "::warning::could not fetch canonical consumer (network); reusing in-tree overlay"
            cp .github/workflows/build.yml /tmp/consumer-build.yml 2>/dev/null || true
          fi
          mkdir -p .github/workflows
          cp /tmp/consumer-build.yml .github/workflows/build.yml
          # prune any OTHER workflow the mirror carried in from upstream (and our
          # own retired legacy ones) so upstream's CI never fires on the fork →
          # build-failure email noise. build.yml is the sole workflow by law.
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'build.yml' -delete
          git add -A .github/workflows
          # [skip ci] is REQUIRED: GITHUB_TOKEN (a GitHub App) can never modify
          # .github/workflows (no `workflows` perm), so the overlay push MUST use
          # the org GH_PAT (workflows scope) — and a PAT push re-triggers `on: push`,
          # so the skip-ci marker is what stops forks from looping on themselves.
          git -c user.name=intarweb-ci -c user.email=ci@intarweb.invalid \
            commit -m "ci: re-apply canonical build workflow overlay [skip ci]"
          # 3b. GitHub caches a workflow's registered `on:` triggers and only
          # re-reads them when the file is deleted + re-added (a content edit or
          # overlay push is NOT a re-registration). Force it: delete then re-add
          # the file via the API so every sync re-registers the canonical
          # triggers (push, pull_request, */15 schedule) on the fork.
          # Trigger re-registration MUST use the org GH_PAT: GITHUB_TOKEN has no
          # `workflows` scope, so these API calls 403 and the re-registration
          # silently no-ops — which left stale `*/5` polls registered after the
          # consumer dropped them. Subshell-scope the PAT so gh uses it for
          # these two calls only.
          WF_PATH=".github/workflows/build.yml"
          (
            export GH_TOKEN="$GH_PAT"
            WF_SHA="$(gh api "repos/${{ github.repository }}/contents/$WF_PATH" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$WF_SHA" ] && [ "$WF_SHA" != "null" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/contents/$WF_PATH" \
                -f message="ci: force re-register build workflow (delete phase) [skip ci]" \
                -f sha="$WF_SHA" >/dev/null 2>&1 || \
                echo "::warning::delete phase failed (will re-add anyway)"
            fi
            gh api -X PUT "repos/${{ github.repository }}/contents/$WF_PATH" \
              -f message="ci: re-register build workflow with canonical triggers (re-add phase) [skip ci]" \
              -f content="$(base64 -w0 /tmp/consumer-build.yml)" >/dev/null 2>&1 || \
              echo "::warning::re-add phase failed — triggers may be stale until next sync"
          )
          # 4. force-push mirror main w/ GH_PAT. Pushing to a URL = anonymous
          #    remote → --force-with-lease can't map the tracking ref, so pass the
          #    expected value explicitly (fresh fetch). checkout@v4's
          #    persist-credentials sets an Authorization extraheader that would
          #    override the URL's PAT with the GITHUB_TOKEN — drop it first.
          git config --unset-all http.https://github.com/.extraheader || true
          git config --unset-all credential.helper || true
          git fetch --quiet origin
          EXPECTED="$(git rev-parse "refs/remotes/origin/$DEFAULT")"
          git push "https://${{ secrets.GH_PAT }}@github.com/intarweb/${{ github.event.repository.name }}.git" \
            "$DEFAULT:refs/heads/$DEFAULT" --force-with-lease="refs/heads/$DEFAULT:$EXPECTED" || \
            echo "::warning::overlay push failed; mirror main may drift until next run"

      - name: 🌱 Seed build.yml onto intarweb→upstream PR branches
        if: steps.cls.outputs.skip == 'false' && steps.cls.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A PR branch cut from UPSTREAM main carries upstream's own workflows (or
          # none), NOT our canonical build.yml — so pushes to that branch fire
          # upstream CI or nothing, never our build. GitHub uses the branch's own
          # workflow file, not main's. Seed the canonical build.yml onto every open
          # intarweb→upstream PR branch that lacks it, so the NEXT push to the branch
          # fires our build (push trigger = the real instant event).
          # Operates in a throwaway clone so it never disturbs this runner's checkout.
          SEED_DIR="$(mktemp -d)"
          git clone -q --no-checkout "https://${{ secrets.GH_PAT }}@github.com/intarweb/${{ github.event.repository.name }}.git" "$SEED_DIR"
          cd "$SEED_DIR"
          while read -r b; do
            [ -z "$b" ] && continue
            git fetch -q origin "$b" 2>/dev/null || continue
            if git ls-tree "origin/$b" .github/workflows/build.yml >/dev/null 2>&1; then
              echo "  $b already has build.yml — skip"
              continue
            fi
            echo "  seeding build.yml onto $b"
            git checkout -q -B seed "origin/$b"
            mkdir -p .github/workflows
            cp /tmp/consumer-build.yml .github/workflows/build.yml
            git add .github/workflows/build.yml
            git -c user.name=intarweb-ci -c user.email=ci@intarweb.invalid               commit -m "ci: seed canonical build.yml onto PR branch [skip ci]" >/dev/null 2>&1 || true
            git push -q "origin" "HEAD:$b" 2>/dev/null ||               echo "::warning::could not push seed to $b"
          done < <(gh pr list -R "${{ steps.cls.outputs.upstream }}" --state open             --json headRefName,headRepositoryOwner             --jq '.[]|select(.headRepositoryOwner.login=="intarweb")|.headRefName')
          # Tolerate git's tmp-file race ("Directory not empty") — this is cleanup,
          # not a build failure.
          rm -rf "$SEED_DIR" 2>/dev/null || true
          echo "  seed complete"

      - name: 🌿 Checkout build tree
        if: steps.cls.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [ "${{ steps.cls.outputs.fork }}" = "true" ]; then
            git checkout -B build-tree "${{ steps.cls.outputs.default }}"
          else
            git checkout -B build-tree "${{ github.sha }}"
          fi
          # submodule contents don't follow superproject checkout -B; top them up
          # (URLs already token-rewritten to HTTPS by checkout@v4; no-op w/o .gitmodules)
          # best-effort submodule top-up: public submodules (excalidraw-full's
          # excalidraw/) populate; private/unreachable ones (keeperdotsh/*) are
          # skipped rather than failing the build.
          git submodule update --init --recursive 2>/dev/null || \
            { echo "::warning::some submodules unavailable (private?) — continuing"; true; }
          echo "  building $(git rev-parse HEAD)"

      - name: "🔢 Fingerprint (fork: upstream + sorted PR shas | greenfield: git sha)"
        id: fp
        if: steps.cls.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.cls.outputs.fork }}" = "true" ]; then
            MAIN_SHA="${{ steps.sync.outputs.upstream_sha }}"
            mapfile -t BRANCHES < <(gh pr list -R "${{ steps.cls.outputs.upstream }}" --state open \
              --json headRefName,headRepositoryOwner \
              --jq '.[]|select(.headRepositoryOwner.login=="intarweb")|.headRefName')
            PR_SHAS=""
            for b in "${BRANCHES[@]:-}"; do
              [ -z "$b" ] && continue
              git fetch --quiet origin "$b:pr/$b" || continue
              PR_SHAS="$PR_SHAS $(git rev-parse "pr/$b")"
              echo "  PR branch $b -> $(git rev-parse "pr/$b")"
            done
            SORTED="$(printf '%s\n' $PR_SHAS | sort | tr '\n' ' ')"
            FP="$(printf '%s %s' "$MAIN_SHA" "$SORTED" | sha256sum | cut -c1-12)"
            echo "branches=${BRANCHES[*]:-}" >> "$GITHUB_OUTPUT"
          else
            FP="$(git rev-parse HEAD | cut -c1-12)"
            echo "branches=" >> "$GITHUB_OUTPUT"
          fi
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          { echo "### ${{ steps.cls.outputs.image }}"; \
            echo "- fork: \`${{ steps.cls.outputs.fork }}\` upstream: \`${{ steps.cls.outputs.upstream }}\`"; \
            echo "- head: \`$(git rev-parse HEAD)\`"; \
            echo "- open PRs: \`${BRANCHES[*]:-<none>}\`"; \
            echo "- fp: \`sha-$FP\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: ⏭️ No-op check (fingerprint already published?)
        id: noop
        if: steps.cls.outputs.skip == 'false'
        run: |
          FP="sha-${{ steps.fp.outputs.fp }}"
          T="$(curl -sf "https://ghcr.io/token?scope=repository:intarweb/${{ steps.cls.outputs.image }}:pull" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)"
          CODE=000
          [ -n "$T" ] && CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/intarweb/${{ steps.cls.outputs.image }}/manifests/$FP")"
          if [ "$CODE" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  no-op ($FP present)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  building ($FP http $CODE)"
          fi

      - name: 🍒 Assemble (cherry-pick open PRs onto build tree)
        if: steps.cls.outputs.skip == 'false' && steps.noop.outputs.skip == 'false' && steps.cls.outputs.fork == 'true'
        run: |
          set -euo pipefail
          git config user.name intarweb-ci
          git config user.email ci@intarweb.invalid
          for b in ${{ steps.fp.outputs.branches }}; do
            echo "  cherry-pick HEAD..pr/$b"
            if ! git cherry-pick -X theirs "HEAD..pr/$b" 2>/tmp/cp.err; then
              # Retry WITHOUT the overlay file (build.yml) in the way: PR branches
              # are cut from upstream and carry upstream's own workflows, so the
              # canonical build.yml we seeded is an add/add conflict. Resolve it
              # in favor of OUR canonical file and retry the pick so the PR's real
              # changes (Dockerfile, source) still land.
              if git checkout --theirs -- .github/workflows/build.yml 2>/dev/null; then
                git add .github/workflows/build.yml
                if GIT_EDITOR=true git cherry-pick --continue 2>/tmp/cp2.err; then
                  echo "  resolved build.yml conflict for $b; rest applied"
                else
                  git cherry-pick --abort || true
                  echo "::warning::PR $b conflicts beyond build.yml — skipped; rebase it to fold in"
                  cat /tmp/cp2.err >&2 || true
                fi
              else
                git cherry-pick --abort || true
                echo "::warning::PR $b conflicts with upstream — skipped (not in :latest); rebase the PR to fold it in"
                cat /tmp/cp.err >&2 || true
              fi
            fi
          done

      - name: 🔍 Locate Dockerfile + context
        id: df
        if: steps.cls.outputs.skip == 'false' && steps.noop.outputs.skip == 'false'
        env:
          DOCKERFILE: ${{ vars.DOCKERFILE }}
          CONTEXT: ${{ vars.CONTEXT }}
        run: |
          set -euo pipefail
          DF=""
          CTX="."
          # explicit repo vars win only if the file actually exists (org default
          # DOCKERFILE=Dockerfile must not break rootless repos)
          [ -n "${DOCKERFILE:-}" ] && [ -f "$DOCKERFILE" ] && DF="$DOCKERFILE"
          if [ -z "$DF" ]; then
            if [ -f Dockerfile ]; then DF="Dockerfile"
            elif [ -f docker/Dockerfile ]; then DF="docker/Dockerfile"; CTX="docker"
            else
              DF="$(find . -maxdepth 2 \( -name Dockerfile -o -name '*.dockerfile' \) | head -1 | sed 's#^\./##')"
              CTX="$(dirname "$DF")"
            fi
          else
            CTX="${CONTEXT:-.}"
          fi
          if [ -z "$DF" ]; then
            # Pure-source fork (HACS integration etc.) — nothing to build. The sync
            # still keeps main a mirror; the build steps no-op on skip=true below.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  no Dockerfile in tree — nothing to build (skip)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  dockerfile=$DF context=$CTX"
          fi
          echo "df=$DF" >> "$GITHUB_OUTPUT"
          echo "ctx=$CTX" >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Buildx
        if: steps.cls.outputs.skip == 'false' && steps.noop.outputs.skip == 'false' && steps.df.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GHCR
        if: steps.cls.outputs.skip == 'false' && steps.noop.outputs.skip == 'false' && steps.df.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build + push :latest + :sha-<fp>
        if: steps.cls.outputs.skip == 'false' && steps.noop.outputs.skip == 'false' && steps.df.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.df.outputs.ctx }}
          file: ${{ steps.df.outputs.df }}
          platforms: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
          build-args: ${{ vars.BUILD_ARGS }}
          push: true
          provenance: false
          tags: |
            ghcr.io/intarweb/${{ steps.cls.outputs.image }}:latest
            ghcr.io/intarweb/${{ steps.cls.outputs.image }}:sha-${{ steps.fp.outputs.fp }}
